name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: ${{ matrix.engine }} on TeX Live ${{ matrix.texlive }}
    runs-on: ubuntu-latest
    container: texlive/texlive:${{ matrix.texlive }}
    strategy:
      fail-fast: false
      matrix:
        texlive: [latest]
        engine: [pdflatex, lualatex, xelatex]
        include:
          # The oldest supported LaTeX format is 2021-11-15, which TeX Live 2021 ships.
          - texlive: TL2021-historic
            engine: pdflatex
          # arXiv compiles with TeX Live 2025 by default and offers 2023.
          - texlive: TL2023-historic
            engine: pdflatex
          - texlive: TL2025-historic
            engine: pdflatex
    steps:
      - uses: actions/checkout@v4
      - name: Install test tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make python3 poppler-utils
      - name: Versions
        run: |
          ${{ matrix.engine }} --version | head -1
          cd "$(mktemp -d)"
          printf '%s\n' '\documentclass{article}\usepackage{amsmath,hyperref,cleveref}\listfiles\begin{document}\end{document}' > versions.tex
          ${{ matrix.engine }} -interaction=nonstopmode versions.tex >/dev/null || true
          grep -E '^LaTeX2e <|^ *(amsmath|hyperref|cleveref)\.sty' versions.log
      - name: Generate mermin.sty
        run: make mermin.sty
      - name: Build the manual
        if: matrix.engine == 'pdflatex'
        run: make mermin.pdf
      - name: Test
        run: make test ENGINE=${{ matrix.engine }}
      - name: Keep logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ matrix.engine }}-${{ matrix.texlive }}
          path: |
            test/*.log
            test/*.aux

  manual:
    name: manual
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - uses: actions/checkout@v4
      - name: Install make
        run: |
          apt-get update
          apt-get install -y --no-install-recommends make
      - name: Build mermin.pdf
        run: make
      - uses: actions/upload-artifact@v4
        with:
          name: mermin.pdf
          path: mermin.pdf
